[package]
name = "sim-lib-view-search"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Offline, evidence-preserving search audit surface for SIM Web."
publish = true
repository = "https://github.com/sim-nest/sim-web"
homepage = "https://github.com/sim-nest/sim-web"
readme = "README.md"
include = ["/src/**", "/recipes/**", "/build.rs", "/README.md", "/BROCHURE.md"]

[dependencies]
sim-kernel = { version = "0.3.0" }
sim-lib-scene = { version = "0.3.0", path = "../sim-lib-scene" }
sim-lib-search-core = { version = "0.1.0" }
sim-lib-view = { version = "0.3.0", path = "../sim-lib-view" }
sim-lib-web-core = { version = "0.1.0" }

[dev-dependencies]
sim-lib-net-core = { version = "0.3.0" }

[lints]
workspace = true
