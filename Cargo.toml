
[workspace]
resolver = "3"
members = [
  "crates/sim-lib-intent",
  "crates/sim-lib-scene",
  "crates/sim-lib-view",
  "crates/sim-lib-view-bridge",
  "crates/sim-lib-view-agent",
  "crates/sim-lib-view-codec",
  "crates/sim-lib-view-continuity-phone",
  "crates/sim-lib-view-daw",
  "crates/sim-lib-view-device",
  "crates/sim-lib-view-estate",
  "crates/sim-lib-view-doc",
  "crates/sim-lib-view-interference",
  "crates/sim-lib-view-math",
  "crates/sim-lib-view-search",
  "crates/sim-lib-view-spatial",
  "crates/sim-lib-view-wasm-frame",
  "crates/sim-lib-view-wrist",
  "crates/sim-lib-view-worktable",
  "crates/sim-lib-web-bridge",
  "crates/sim-lib-web-layout",
  "crates/sim-web-shell",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-web"
homepage = "https://github.com/sim-nest/sim-web"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.sim]
docs-command = "cargo run -p xtask -- simdoc"
validation-commands = [
  "cargo fmt --all --check",
  "cargo test --workspace",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo doc --workspace --no-deps",
  "cargo clippy --workspace --all-features --all-targets -- -D warnings",
  "cargo test --workspace --all-features",
  "cargo test --manifest-path crates/sim-lib-view-device/attention-policy-focused/Cargo.toml",
]
contract-exclusions = [
  { path = "crates/sim-lib-view-device/attention-policy-focused", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-view-device/attention-policy-focused/Cargo.toml", reason = "Runs the attention policy tests through their own manifest." },
]
